services:

  nginx:
    image: nginx:alpine
    container_name: nginx

    ports:
      - "80:80"

    volumes:
      - ./backend:/var/www/backend
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - backend
      - frontend

  backend:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    container_name: laravel

    working_dir: /var/www/backend

    volumes:
      - ./backend:/var/www/backend

    depends_on:
      - mysql
      - redis
      - pikafish

  pikafish:
    build:
      context: .
      dockerfile: docker/pikafish/Dockerfile
      args:
        PIKAFISH_REF: 99793311968f59cf5be2dd03f646b25ab8ab56e3
        PIKAFISH_NNUE_SHA256: 7d13d73569a9b571ba0eb20cf1596247bc2a42738967e61afef6482b231e900e
        PIKAFISH_ARCH: ${PIKAFISH_ARCH:-x86-64-sse41-popcnt}
    environment:
      PIKAFISH_THREADS: ${PIKAFISH_THREADS:-1}
      PIKAFISH_HASH_MB: ${PIKAFISH_HASH_MB:-128}
    restart: unless-stopped

  frontend:
    image: node:22-alpine

    container_name: nuxt
    environment:
      API_PROXY_TARGET: http://nginx

    working_dir: /app

    volumes:
      - ./frontend:/app

    command: sh -c "npm install && npm run dev"

    ports:
      - "3000:3000"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    command: tunnel --no-autoupdate --url http://nginx:80 --http-host-header localhost
    depends_on:
      - nginx
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: laravel-nuxt-mysql-local
    environment:
      MYSQL_DATABASE: laravel_nuxt
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: user123
      MYSQL_PASSWORD: root
    ports:
      - "3310:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

  redis:
    image: redis:7-alpine

    container_name: redis

    ports:
      - "6381:6381"

volumes:
  mysql_data:
